<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blood Bank – Hospital ERP</title>
<style>
:root{--pr:#f97316;--prd:#ea580c;--nv:#1e3a8a;--bd:#dbe3f0;--hd:#e9effb;--bg:#f4f7fc;--tx:#1f2937;--mu:#6b7280;--ok:#16a34a;--er:#dc2626;--wa:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden}
aside{width:230px;background:#fff;border-right:1px solid var(--bd);padding:18px 10px;flex-shrink:0;overflow-y:auto}
.logo{text-align:center;padding-bottom:18px;color:var(--nv);font-weight:700;font-size:17px}.logo svg{display:block;margin:0 auto 4px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:2px 0;border-radius:8px;cursor:pointer;color:#374151;font-weight:500}
.nav .ic{color:#3b4f86}.nav:hover{background:#f3f6fc}
.nav.on{background:#fff1e6;color:var(--prd);box-shadow:inset 3px 0 var(--pr)}.nav.on .ic{color:var(--pr)}
main{flex:1;overflow-y:auto;padding:0 26px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px;color:var(--mu);font-size:13px}
.top a{color:var(--prd);cursor:pointer}.top span.c{display:inline-flex;gap:6px;align-items:center}
h1{font-size:23px;color:var(--nv);margin:2px 0 14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;margin-bottom:16px;overflow:hidden}
.sh{display:flex;align-items:center;gap:8px;color:var(--nv);font-weight:700;font-size:15px;padding:13px 18px}
.sh .ic{color:var(--er)}.sh.b .ic{color:var(--nv)}
.cb{padding:4px 18px 18px}
.sub{background:#f5f8fe;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:14px}
label{display:block;font-size:12.5px;font-weight:600;color:#475569;margin-bottom:5px}label i{color:var(--er);font-style:normal}
input,select,textarea{font:inherit;width:100%;border:1px solid #cfd8e6;border-radius:7px;padding:9px 11px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid #fed7aa;border-color:var(--pr)}
input:disabled{background:#e5e9f0;color:#4b5563}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid #b9c4d6;background:#fff;color:#111827;border-radius:7px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#f6f8fc}.btn.pr{background:var(--pr);border-color:var(--pr);color:#fff}.btn.pr:hover{background:var(--prd)}
.btn.sm{padding:4px 11px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.acts{display:flex;justify-content:flex-end;gap:10px;padding:0 18px 16px}
.tg{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:4px}
.tg input{display:none}.tg s{width:40px;height:22px;border-radius:99px;background:#cbd5e1;position:relative;cursor:pointer;transition:.2s}
.tg s:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked+s{background:var(--pr)}.tg input:checked+s:after{left:20px}
.bar{display:flex;gap:10px;align-items:center;padding:0 18px 12px;flex-wrap:wrap}
.sx{position:relative;max-width:260px;flex:1}.sx .ic{position:absolute;left:10px;top:10px;color:var(--mu)}.sx input{padding-left:32px}
table{width:100%;border-collapse:collapse}
th{background:var(--hd);color:#1e3a8a;text-align:left;font-size:13px;font-weight:600;padding:10px 14px;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #edf1f8}tr:last-child td{border-bottom:0}.ov{overflow-x:auto;padding:0 18px 4px}
.pill{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:600;background:#dcfce7;color:#166534;white-space:nowrap}
.pill.w{background:#fef3c7;color:#92400e}.pill.e{background:#fee2e2;color:#991b1b}.pill.i{background:#dbeafe;color:#1e40af}.pill.m{background:#eef1f5;color:#475569}.pill.p{background:#ede9fe;color:#5b21b6}
.eye{color:var(--nv);cursor:pointer}
.pg{display:flex;gap:6px;padding:4px 18px 16px}.pg b{min-width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--bd);border-radius:6px;cursor:pointer;font-weight:500;background:#fff}.pg b.on{background:#2563eb;color:#fff;border-color:#2563eb}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--bd);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 18px;cursor:pointer;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--prd);border-bottom-color:var(--pr)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 12px}.chip{padding:4px 12px;border:1px solid var(--bd);border-radius:99px;background:#fff;cursor:pointer;font-size:12px}.chip.on{background:var(--nv);color:#fff;border-color:var(--nv)}
.alert{margin:0 18px 12px;padding:10px 14px;border-radius:7px;font-size:13px}.al-e{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}.al-w{background:#fffbeb;border:1px solid #fde68a;color:#92400e}.al-i{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.kp div{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px}.kp small{color:var(--mu)}.kp b{display:block;font-size:26px;color:var(--nv)}
.steps{display:flex;padding:6px 18px 14px;overflow-x:auto}.st{flex:1;min-width:105px;text-align:center;font-size:12px;color:var(--mu);position:relative;padding-top:30px}
.st:before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;font-weight:700;color:#475569;z-index:1}
.st:after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#e2e8f0}.st:first-child:after{display:none}
.st.d:before{background:var(--ok);color:#fff}.st.d:after{background:var(--ok)}.st.c:before{background:var(--pr);color:#fff}.st.c{color:var(--prd);font-weight:600}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #edf1f8}.li:last-child{border:0}
.chk{display:flex;gap:8px;align-items:center;padding:5px 0}.chk input{width:auto}
.help{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--pr);border-radius:10px;padding:16px 20px;margin-top:22px}
.help h4{color:var(--nv);margin-bottom:6px}.help p{color:#475569;margin-bottom:6px}.help ul{margin:4px 0 0 18px;color:#475569}.help li{margin-bottom:3px}
.rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:0 18px 18px}.rep div{border:1px solid var(--bd);border-radius:10px;padding:14px;cursor:pointer}.rep div:hover{border-color:var(--pr);background:#fff7ed}.rep b{display:block;color:var(--nv)}.rep small{color:var(--mu)}
.toast{position:fixed;bottom:22px;right:22px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:9}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8a97b1;padding:14px 14px 4px}
.tl{padding:6px 28px 14px}.tl div{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--bd)}.tl div:before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--pr)}.tl b{color:var(--nv);display:block}.tl small{color:var(--mu)}
@media(max-width:900px){aside{display:none}}
</style>
</head>
<body>
<aside id="side"></aside>
<main><div class="top"><div id="crumb"></div><span class="c" onclick="toast('Help is shown at the bottom of each page')" style="cursor:pointer;color:var(--nv)" id="hq"></span></div><div id="view"></div></main>
<div class="toast" id="toast"></div>
<script>
/* ---------- icons ---------- */
const I={user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',box:'<path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/>',clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h6"/>',swap:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',pulse:'<path d="M3 12h4l2-5 4 10 2-5h6"/>',chart:'<path d="M4 20V4M4 20h16M8 16v-5M13 16V8M18 16v-3"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',filter:'<path d="M3 5h18l-7 8v6l-4-2v-4z"/>',cal:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',save:'<path d="M5 3h12l3 3v15H5zM8 3v6h8V3M8 21v-7h8v7"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17v.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',temp:'<path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/>',sliders:'<path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h0"/><circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="18" cy="18" r="2.2"/>',layers:'<path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',undo:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/>',flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>'};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const LOGO='<svg width="46" height="52" viewBox="0 0 46 52"><path d="M23 2S6 20 6 33a17 17 0 0 0 34 0C40 20 23 2 23 2z" fill="#1e5fb4"/><path d="M23 24v14M16 31h14" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>';

/* ---------- data ---------- */
let donors=[{id:'D-001',name:'Asha Thapa',age:29,sex:'F',grp:'B+',phone:'9801112233',last:'2026-07-02',st:'ELIGIBLE'},{id:'D-002',name:'Ramesh Karki',age:41,sex:'M',grp:'O+',phone:'9812345678',last:'2026-06-20',st:'ELIGIBLE'},{id:'D-003',name:'Sita Gurung',age:35,sex:'F',grp:'A+',phone:'9845000111',last:'2026-05-11',st:'ELIGIBLE'},{id:'D-004',name:'Hari Shrestha',age:38,sex:'M',grp:'A+',phone:'9860123456',last:'2026-10-20',st:'DEFERRED',until:'2027-01-20',why:'Recent donation interval'},{id:'D-005',name:'Anita Rai',age:24,sex:'F',grp:'B-',phone:'9851000222',last:'-',st:'PENDING'}];
let coll=[{d:'2026-11-06',n:'Asha Thapa',g:'B+',v:450,bag:'BBN-2026-1123',by:'Dr. Sita Sharma',s:'Qualified'},{d:'2026-11-05',n:'Ramesh Karki',g:'O+',v:450,bag:'BBN-2026-1122',by:'Dr. Ram Bhandari',s:'Qualified'},{d:'2026-11-04',n:'Sita Gurung',g:'A+',v:450,bag:'BBN-2026-1121',by:'Dr. Sita Sharma',s:'Qualified'},{d:'2026-11-03',n:'Bikash Thapa',g:'AB+',v:450,bag:'BBN-2026-1120',by:'Dr. Ram Bhandari',s:'Qualified'}];
let units=[['U-24001-RC','Red Cells','A+',280,'2026-12-10','Fridge-1 / Shelf 2','AVAILABLE'],['U-24002-RC','Red Cells','O+',285,'2026-12-14','Fridge-1 / Shelf 1','AVAILABLE'],['U-24003-RC','Red Cells','A-',275,'2026-11-08','Fridge-1 / Shelf 3','AVAILABLE'],['U-24004-RC','Red Cells','B+',280,'2026-12-02','Fridge-2 / Shelf 1','AVAILABLE'],['U-24005-PL','Plasma','AB+',220,'2027-10-01','Freezer-1 / Rack 1','AVAILABLE'],['U-24006-PLT','Platelets','O+',60,'2026-11-10','Agitator-1','QUARANTINE'],['U-24007-RC','Red Cells','O-',280,'2026-12-20','Fridge-2 / Shelf 2','HELD'],['U-24010-RC','Red Cells','B+',280,'2026-12-18','Fridge-2 / Shelf 3','TESTING'],['U-23990-RC','Red Cells','A+',280,'2026-11-01','Fridge-1 / Shelf 4','EXPIRED'],['U-24008-RC','Red Cells','A+',280,'2026-12-05','Fridge-1 / Shelf 2','RETURN_PENDING_ASSESSMENT']].map(a=>({id:a[0],comp:a[1],grp:a[2],vol:a[3],exp:a[4],loc:a[5],st:a[6]}));
let tests=[{u:'U-24006-PLT',g:'O+',r:['NR','NR','NR','NR'],rev:false},{u:'U-24007-RC',g:'O-',r:['NR','REACTIVE','NR','NR'],rev:true},{u:'U-24010-RC',g:'B+',r:['Pending','Pending','Pending','Pending'],rev:false}];
const compat={'A+':['A+','A-','O+','O-']};
let xs=2,reserved=null,cp=1,stF='ALL';
const PC={QUARANTINE:'w',TESTING:'i',AVAILABLE:'',RESERVED:'p',ISSUED:'m',RETURN_PENDING_ASSESSMENT:'w',DISCARDED:'e',EXPIRED:'e',RECALLED:'e',HELD:'e'};
const pill=(t,c)=>`<span class="pill ${c!==undefined?c:PC[t]||''}">${t.replace(/_/g,' ')}</span>`;

/* ---------- helpers ---------- */
const $=s=>document.getElementById(s);
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2300)};
const f=(l,o={})=>`<div><label>${l}${o.r?' <i>*</i>':''}</label>${o.o?`<select id="${o.id||''}" onchange="${o.ch||''}">${o.o.map(x=>`<option>${x}</option>`).join('')}</select>`:o.ta?`<textarea id="${o.id||''}" rows="3" placeholder="${o.p||''}"></textarea>`:`<input id="${o.id||''}" type="${o.t||'text'}" value="${o.v||''}" placeholder="${o.p||''}" ${o.d?'disabled':''}>`}</div>`;
const sec=(i,t,b)=>`<div class="sh ${b?'b':''}">${ic(i,17)} ${t}</div>`;
const card=h=>`<div class="card">${h}</div>`;
const table=(h,r)=>`<div class="ov"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const bar=(btn,ph='Search...')=>`<div class="bar"><div class="sx">${ic('search',15)}<input placeholder="${ph}"></div><button class="btn">${ic('filter',15)} Filter</button><span style="flex:1"></span>${btn}</div>`;
const eye=`<span class="eye" onclick="toast('Opening details')">${ic('eye')}</span>`;
const ok=(m)=>toast(m);
const act=(a,b)=>`<div class="acts"><button class="btn" onclick="${a[1]||''}">${a[0]}</button><button class="btn pr" onclick="${b[1]}">${ic('save',15)} ${b[0]}</button></div>`;

/* ---------- navigation ---------- */
const NAV=[['G','Set Up'],['setup','Set Up','sliders'],['G','Donor and Collection'],['donor','Donor','user'],['collect','Blood Collection','drop'],['G','Testing and Processing'],['test','Testing & Screening','flask'],['proc','Component Processing','layers'],['qa','Quality Review & Release','shield'],['G','Inventory'],['inv','Blood Inventory','box'],['G','Patient Request and Issue'],['req','Blood Requests','clip'],['xm','Crossmatching','swap'],['trans','Transfusion','pulse'],['G','Returns and Reporting'],['ret','Returns','undo'],['dis','Discards','trash'],['rep','Reports','chart'],['G','System'],['set','Settings','gear']];
const TABS={setup:[['groups','Blood Groups'],['comps','Blood Components'],['types','Donation Types'],['tests','Screening Test Catalog'],['loc','Storage Locations'],['deferral','Deferral Reasons'],['discard','Discard Reasons'],['roles','Roles / Permissions']],donor:[['list','Donor List'],['reg','Register Donor'],['elig','Eligibility Assessment']],test:[['list','Test Results'],['group','Blood Grouping (ABO/RhD)'],['screen','Infectious Disease Screening']],proc:[['new','Process Donation'],['list','Derived Components']],qa:[['queue','Quarantine Queue'],['rev','Quality Review & Release'],['blocked','Blocked Units & Disposition']],inv:[['stock','Stock'],['temp','Storage & Temperature']],req:[['list','Request List'],['new','New Request']],trans:[['issue','Issue Units'],['rec','Transfusion Record']],ret:[['pending','Pending Assessment'],['new','Record Return']],dis:[['list','Discard Register'],['new','Record Discard']],rep:[['center','Report Center'],['trace','Traceability']]};
let pg='collect',ST={setup:'groups',donor:'list',test:'list',proc:'new',qa:'queue',inv:'stock',req:'list',trans:'issue',ret:'pending',dis:'list',rep:'center'};
const go=p=>{pg=p;render()},tab=t=>{ST[pg]=t;render()};

/* ---------- views ---------- */
const V={};
V['donor.list']=()=>card(sec('user','Donor Register',1)+bar(`<button class="btn pr" onclick="tab('reg')">${ic('plus',15)} Register Donor</button>`,'Search by ID, name or phone')+table(['Donor ID','Name','Age / Sex','Blood Group','Phone','Last Donation','Status','Action'],donors.map(d=>[d.id,d.name,d.age+' / '+d.sex,d.grp,d.phone,d.last,d.st=='ELIGIBLE'?pill('Eligible',''):d.st=='DEFERRED'?pill('Deferred until '+d.until,'e'):pill('Assessment pending','w'),`${eye} &nbsp; <button class="btn sm" onclick="tab('elig')">Assess</button>`])));
V['donor.reg']=()=>card(sec('user','Donor Registration',1)+`<div class="cb"><div class="row">${f('Donor ID',{d:1,v:'Auto-generated (D-006)'})}${f('Full Name',{r:1,id:'rn'})}${f('Date of Birth',{t:'date',r:1})}${f('Sex',{r:1,o:['Female','Male','Other']})}</div><div class="row">${f('Phone',{r:1})}${f('National ID / Citizenship No.')}${f('Address')}${f('Blood Group (if known)',{id:'rg',o:['Unknown','A+','A-','B+','B-','O+','O-','AB+','AB-']})}</div></div><div class="sh b sub">${ic('clip',17)} History and Consent</div><div class="cb" style="padding-top:14px"><div class="row">${f('Prior donations',{t:'number',v:0})}${f('Relevant medical history',{ta:1,p:'As required by local policy'})}</div><label class="tg"><input type="checkbox"><s></s> Donor consent obtained for donation and screening</label></div>`+act(['Cancel',"tab('list')"],['Register','regDonor()']));
V['donor.elig']=()=>card(sec('clip','Eligibility Assessment',1)+`<div class="cb"><div class="row">${f('Donor',{r:1,id:'ed',o:donors.map(d=>d.id+' - '+d.name)})}${f('Weight (kg)',{t:'number',r:1})}${f('Haemoglobin (g/dL)',{t:'number',r:1})}${f('Pulse',{t:'number'})}</div><div class="row">${f('Blood Pressure')}${f('Temperature (C)',{t:'number'})}${f('Assessed By',{r:1,o:['Dr. Sita Sharma','Dr. Ram Bhandari']})}${f('Decision',{r:1,id:'dc',ch:"$('df').style.display=this.value=='Deferred'?'grid':'none'",o:['Eligible','Deferred']})}</div><div class="row" id="df" style="display:none">${f('Deferral Reason',{r:1,o:mast('deferral')})}${f('Deferred From',{t:'date'})}${f('Deferred Until',{t:'date',id:'du'})}</div></div><div class="alert al-w">Collection is blocked automatically while a donor is deferred.</div>`+act(['Cancel',"tab('list')"],['Save Decision','saveElig()']));

const collPage=()=>{const s=(cp-1)*3,r=coll.slice(s,s+3),n=Math.ceil(coll.length/3);return table(['Date','Donor Name','Blood Group','Volume (ml)','Bag Number','Collected By','Status','Action'],r.map(c=>[c.d,c.n,c.g,c.v,c.bag,c.by,pill(c.s,c.s=='Qualified'?'':'w'),eye]))+`<div class="pg" style="padding-top:12px"><b onclick="cp=Math.max(1,cp-1);render()">&lsaquo;</b>${Array.from({length:n},(_,i)=>`<b class="${cp==i+1?'on':''}" onclick="cp=${i+1};render()">${i+1}</b>`).join('')}<b onclick="cp=Math.min(${n},cp+1);render()">&rsaquo;</b></div>`};

function resv(id){units.find(u=>u.id==id).st='RESERVED';reserved=id;xs=Math.max(xs,4);render()}


const qaChk=()=>{$('rb').disabled=![...document.querySelectorAll('.qc')].every(x=>x.checked&&!x.disabled)};
function saveGroup(){const t=tOf($('tg_u').value);if(!t)return;tgSel=t.u;if($('tg_rv').value=='Discrepant'){t.g='Pending';t.rev=false;render();return toast('Discrepancy: grouping unresolved, unit stays blocked')}
 t.g=$('tg_abo').value+($('tg_rh').value=='Positive'?'+':'-');t.m=$('tg_m').value;t.op=$('tg_op').value;t.ts=($('tg_ts').value||NOWI).replace('T',' ');t.rev=false;const u=un(t.u);if(u)u.grp=t.g;ST.test='list';render();toast('ABO/RhD recorded - pending review')}
function saveScreen(){const t=tOf($('ts_u').value);if(!t)return;const m={'Non-reactive':'NR','Reactive':'REACTIVE','Indeterminate':'INDETERMINATE'};t.r=[0,1,2,3].map(i=>m[$('sr'+i).value]);t.op=$('ts_op').value;t.ts=($('ts_ts').value||NOWI).replace('T',' ');t.rev=false;const u=un(t.u);if(u&&t.r.includes('REACTIVE'))u.st='HELD';ST.test='list';render();toast(t.r.includes('REACTIVE')?'Reactive result: unit held':'Screening recorded - pending review')}
function saveProc(){const bag=$('pp').value,tl=bag.slice(-4),c0=coll.find(c=>c.bag==bag);let n=0;
 COMPS().forEach((c,i)=>{if(!$('pc'+i)||!$('pc'+i).checked)return;const id='U-'+tl+'-'+c[1];if(un(id))return;units.push({id,comp:c[0],grp:c0?c0.g:'-',vol:+$('pv'+i).value,exp:$('pe'+i).value,loc:'Quarantine area',st:'QUARANTINE',parent:bag});const pt=tests.find(t=>t.bag==bag);tests.push(pt?{...pt,u:id,r:[...pt.r],rev:false}:{u:id,bag,g:'Pending',m:'-',r:['Pending','Pending','Pending','Pending'],op:'-',ts:'-',rev:false});n++});
 if(n){ST.proc='list';render();toast(n+' component(s) created in QUARANTINE')}else toast('Components for this donation already exist')}
function relQA(){const u=un(qaU),t=tOf(qaU);if(!t||tState(t)!='CLEARED')return toast('Blocked: results not cleared');t.rev=true;u.st='AVAILABLE';if(u.loc=='Quarantine area')u.loc='Fridge-1 / Shelf 1';qaU=null;render();toast('Unit released to AVAILABLE')}
function holdQA(){un(qaU).st='HELD';qaU=null;render();toast('Unit held - disposition required')}
function disp(id,i){const d=$('bd'+i).value;if(d.startsWith('Select'))return toast('Select a disposition');const u=un(id),why=blockWhy(u);if(d=='Discard'){u.st='DISCARDED';dscs.unshift({u:id,reason:why,at:NOW,by:'Lab staff',auth:$('ba'+i).value,method:'Incineration',det:'From quality review'})}else if(d=='Re-test')u.st='TESTING';else u.st='QUARANTINE';render();toast('Disposition recorded')}
function saveRet(){const id=$('rtu').value;if(!id)return toast('No unit available to return');rets.push({u:id,req:$('rtr').value,ward:$('rtw').value,at:($('rtt').value||NOWI).replace('T',' '),mins:+$('rtm').value,temp:$('rtp').value,seal:$('rts').value});const u=un(id);if(u)u.st='RETURN_PENDING_ASSESSMENT';ST.ret='pending';render();toast('Unit moved to RETURN PENDING ASSESSMENT')}
function assess(i){const r=rets[i],d=$('rd'+i).value;if(d.startsWith('Select'))return toast('Select a disposition');if(d=='Return to AVAILABLE'&&!retOk(r))return toast('Blocked: unit does not meet re-stock criteria');const u=un(r.u);if(u)u.st=d=='Return to AVAILABLE'?'AVAILABLE':d=='Discard'?'DISCARDED':'QUARANTINE';if(d=='Discard')dscs.unshift({u:r.u,reason:'Returned - unsuitable',at:NOW,by:'Lab staff',auth:$('ra'+i).value,method:'Incineration',det:'From returns assessment'});retHist.unshift({u:r.u,disp:d,by:$('ra'+i).value,at:NOW});rets.splice(i,1);render();toast('Disposition recorded')}
function saveDis(){const id=$('dsu').value;if(!id)return toast('No unit selected');if($('dsb').value==$('dsa').value)return toast('Authoriser must be different from the staff member');dscs.unshift({u:id,reason:$('dsr').value,at:($('dst').value||NOWI).replace('T',' '),by:$('dsb').value,auth:$('dsa').value,method:$('dsm').value,det:$('dsd').value});const u=un(id);if(u)u.st='DISCARDED';ST.dis='list';render();toast('Discard recorded')}
function suAdd(k){const s=SU[k],o={on:true},f0=s.fields[0][0];s.fields.forEach(x=>o[x[0]]=String($('su_'+x[0]).value||'').trim());
 if(!o[f0])return toast('Please fill in the '+s.fields[0][1]);
 if(k=='groups'){o.c=o.a+(o.r=='Positive'?'+':'-');if(s.rows.some(r=>r.c==o.c))return toast('Group already exists')}
 else if(s.rows.some(r=>String(r[f0]).toLowerCase()==o[f0].toLowerCase()))return toast('Already exists');
 s.rows.push(o);render();toast('Added to '+s.title)}
function suTog(k,i){const r=SU[k].rows[i];r.on=!r.on;render()}
function roleAdd(){const n=String($('su_role').value||'').trim();if(!n)return toast('Enter a role name');if(ROLES.includes(n))return toast('Role already exists');ROLES.push(n);RP.push(PERM.map(()=>false));render();toast('Role added')}
function render(){const n=NAV.find(x=>x[0]==pg);
 $('side').innerHTML=`<div class="logo">${LOGO}Blood Bank</div>`+NAV.map(x=>x[0]=='G'?`<div class="grp">${x[1]}</div>`:`<div class="nav ${pg==x[0]?'on':''}" onclick="go('${x[0]}')">${ic(x[2],19)}${x[1]}</div>`).join('');
 $('hq').innerHTML=ic('help',20);
 $('crumb').innerHTML=`<span class="c">${ic('home',16)} <a>Home</a> &rsaquo; <a>Medical</a> &rsaquo; <a>Blood Bank</a> &rsaquo; <b style="color:var(--tx);font-weight:500">${n[1]}</b></span>`;
 const t=TABS[pg]?`<div class="tabs">${TABS[pg].map(x=>`<div class="tab ${ST[pg]==x[0]?'on':''}" onclick="tab('${x[0]}')">${x[1]}</div>`).join('')}</div>`:'';
 $('view').innerHTML=`<h1>${n[1]}</h1>`+t+V[key()]()+help()}
render();
</script>
</body>
</html>
